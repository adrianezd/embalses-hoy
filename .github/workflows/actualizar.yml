name: Actualizar embalses
on:
  schedule:
    - cron: "0 9,18 * * 2,3"   # El MITECO publica el boletín los martes
  workflow_dispatch:
permissions:
  contents: write
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install access-parser
      - run: python actualizar.py
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add datos.json
          git diff --cached --quiet || (git commit -m "Datos de embalses actualizados" && git push)
